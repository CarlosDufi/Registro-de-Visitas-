<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de visitas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b8f97">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1b8f97;--bd:#d9d7d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--tx:#eee;--mu:#9a9a94;--ac:#6fb3c8;--bd:#3a3a38}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--tx:#eee;--mu:#9a9a94;--ac:#6fb3c8;--bd:#3a3a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.logo{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center;margin-bottom:8px}.logo img,.logo svg{max-width:260px;width:70%;height:auto}
h1{font-size:22px;margin:16px 0 16px;text-align:center}h2{font-size:17px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;resize:vertical}
.stars{display:flex;gap:4px}.stars button{border:0;background:none;font-size:30px;line-height:1;padding:2px;color:var(--bd)}.stars button.on{color:#e8a317}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs button{flex:1;padding:12px;border-radius:10px;font-size:15px}.tabs button.on{background:var(--ac);color:#fff}
.chk{display:flex;align-items:center;gap:10px;margin:0;font-size:16px;color:var(--tx);cursor:pointer}.chk input{width:22px;height:22px;padding:0;flex:none}
.sigs{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.sigs figure{margin:0}.sigs img{height:64px;margin:0}.sigs figcaption{font-size:12px;color:var(--mu)}
[hidden]{display:none!important}
canvas{width:100%;height:130px;border:1px dashed var(--bd);border-radius:8px;background:#fff;touch-action:none;display:block}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:14px;cursor:pointer}
button.p{background:var(--ac);color:#fff;width:100%;font-size:16px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center}
.v{border-top:1px solid var(--bd);padding:12px 0}.v:first-child{border-top:0}
.v img{height:36px;background:#fff;border-radius:4px;border:1px solid var(--bd);margin-right:6px}
.mu{color:var(--mu);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#msg{color:var(--ac);font-size:14px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<main>
<div class="logo"><img id="logo" src="logo.png" alt="Prestige Properties" onerror="this.hidden=true;document.getElementById('logoSvg').hidden=false"><svg id="logoSvg" viewBox="0 95 1575 925" hidden role="img" aria-label="Prestige Properties - Sales, Rentals &amp; Concierge"><g fill="none" stroke="#0d1214" stroke-width="20"><path d="M578,693V335A212,212 0 1 1 790,547V693Z"/><path fill="#2ab0b8" stroke-width="18" d="M790,540V355A88,88 0 1 1 878,443V522Q840,538 790,541Z"/></g><g fill="#0d1214" font-family="Cinzel,'Trajan Pro',Georgia,serif" text-anchor="middle"><text x="787" y="890" font-size="150" textLength="1500" lengthAdjust="spacing">PRESTIGE PROPERTIES</text><text x="787" y="975" font-size="80" textLength="1075" lengthAdjust="spacing">SALES, RENTALS &amp; CONCIERGE</text></g></svg></div>
<h1>Registro de visitas</h1>
<nav class="tabs"><button id="b1" class="on" onclick="tab(1)">Nueva visita</button><button id="b2" onclick="tab(2)">Visitas</button></nav>
<section id="t1">
<div class="card">
  <label for="f">Fecha</label><input id="f" type="date">
  <label for="r">Nº referencia</label><input id="r" placeholder="Ej. REF-1024">
  <label for="p">Nombre de propiedad</label><input id="p">
  <label for="c">Nombre cliente</label><input id="c">
  <label>Feedback del cliente</label>
  <div class="stars" id="stars" role="group" aria-label="Valoración"></div>
  <textarea id="fb" placeholder="Comentarios del cliente sobre la propiedad (opcional)" style="margin-top:8px"></textarea>
  <label>Firma cliente</label><canvas id="sc"></canvas>
  <button type="button" onclick="clr('sc')" style="margin-top:6px">Borrar firma</button>
  <label>Firma agente</label><canvas id="sa"></canvas>
  <button type="button" onclick="clr('sa')" style="margin-top:6px">Borrar firma</button>
  <button class="p" id="save">Guardar visita</button>
  <div id="msg"></div>
</div>
</section>
<section id="t2" hidden>
<div class="row" style="margin-top:8px;gap:8px"><h2 style="margin:0">Todas las visitas</h2><button id="pdfbtn" onclick="pdf()">Descargar todas (PDF)</button></div>
<div id="msg2" class="mu" style="min-height:18px;margin:6px 0"></div>
<div class="card" style="padding:12px"><input id="q" type="search" placeholder="Buscar por nº de referencia o propiedad" oninput="draw()"><select id="per" onchange="draw()" style="margin-top:8px"></select></div>
<div class="row" style="margin:4px 0 8px"><label class="chk" style="font-size:14px"><input type="checkbox" id="selall" onchange="selAll(this.checked)">Seleccionar todas</label><span id="cnt" class="mu"></span></div>
<div class="card" id="list"><span class="mu">Aún no hay visitas.</span></div>
</section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let visits=[],db=null,dl=null;
$('f').value=new Date().toISOString().slice(0,10);
const pads={};
function pad(id){
  const c=$(id),x=c.getContext('2d');let d=false,dirty=false;
  function size(){const r=c.getBoundingClientRect(),s=2;c.width=r.width*s;c.height=r.height*s;x.scale(s,s);x.lineWidth=2;x.lineCap='round';x.strokeStyle='#111'}
  size();
  const pos=e=>{const r=c.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  c.addEventListener('pointerdown',e=>{d=true;dirty=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))});
  c.addEventListener('pointermove',e=>{if(d){x.lineTo(...pos(e));x.stroke()}});
  ['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>d=false));
  pads[id]={clear(){x.clearRect(0,0,c.width,c.height);dirty=false},empty:()=>!dirty,
    data(){const t=document.createElement('canvas');t.width=300;t.height=100;t.getContext('2d').drawImage(c,0,0,300,100);return t.toDataURL('image/png')}};
}
pad('sc');pad('sa');
let rating=0;
function drawStars(){$('stars').innerHTML=[1,2,3,4,5].map(n=>`<button type="button" class="${n<=rating?'on':''}" onclick="rating=rating===${n}?0:${n};drawStars()" aria-label="${n} de 5">★</button>`).join('')}
drawStars();
function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):''}
function clr(id){pads[id].clear()}
function msg(t){$('msg').textContent=t}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function tab(n){$('t1').hidden=n!==1;$('t2').hidden=n!==2;$('b1').classList.toggle('on',n===1);$('b2').classList.toggle('on',n===2)}
const fmt=d=>d.split('-').reverse().join('/');
const sorted=()=>[...visits].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const qOf=d=>{const p=d.split('-');return p[0]+'-Q'+Math.ceil(p[1]/3)};
function buildPer(){
  const el=$('per'),cur=el.value||'all';
  const ms=[...new Set(visits.map(v=>v.date.slice(0,7)))].sort().reverse();
  const qs=[...new Set(visits.map(v=>qOf(v.date)))].sort().reverse();
  el.innerHTML='<option value="all">Todo el periodo</option>'
    +(qs.length?'<optgroup label="Trimestres">'+qs.map(q=>`<option value="${q}">T${q.slice(-1)} ${q.slice(0,4)}</option>`).join('')+'</optgroup>':'')
    +(ms.length?'<optgroup label="Meses">'+ms.map(m=>`<option value="${m}">${MES[+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('')+'</optgroup>':'');
  el.value=[...el.options].some(o=>o.value===cur)?cur:'all';
}
const isFiltered=()=>$('q').value.trim()!==''||$('per').value!=='all';
function filtered(){
  const q=norm($('q').value.trim()),p=$('per').value;
  return sorted().filter(v=>{
    if(q&&!(norm(v.ref).includes(q)||norm(v.property).includes(q)))return false;
    if(p==='all')return true;
    return p.includes('Q')?qOf(v.date)===p:v.date.slice(0,7)===p;
  });
}
const sel=new Set();
function toggle(id,on){on?sel.add(id):sel.delete(id);upd()}
function selAll(on){filtered().forEach(v=>on?sel.add(v.id):sel.delete(v.id));draw()}
function upd(){
  const n=sel.size,f=filtered();
  $('pdfbtn').textContent=n?`Descargar seleccionadas (${n})`:(isFiltered()?`Descargar resultados (${f.length})`:'Descargar todas (PDF)');
  $('selall').checked=f.length>0&&f.every(v=>sel.has(v.id));
  $('cnt').textContent=isFiltered()?`${f.length} de ${visits.length} visitas`:`${visits.length} visitas`;
}
function block(d,v,y){
  d.setDrawColor(190);d.rect(15,y,180,76);
  d.setFontSize(12);d.setFont(undefined,'bold');d.text(d.splitTextToSize('Propiedad: '+v.property,170)[0],20,y+8);
  d.setFont(undefined,'normal');d.setFontSize(10);
  d.text('Fecha: '+fmt(v.date),20,y+15);d.text('Nº ref.: '+v.ref,80,y+15);
  d.text('Cliente: '+v.client,20,y+21);
  if(v.rating)d.text('Valoración: '+v.rating+'/5',20,y+27);
  if(v.feedback)d.text(d.splitTextToSize('Feedback: '+v.feedback,170).slice(0,2),20,y+33);
  d.setFontSize(9);d.text('Firma cliente',20,y+46);d.text('Firma agente',110,y+46);
  try{d.addImage(v.clientSig,'PNG',20,y+49,70,23.3);d.addImage(v.agentSig,'PNG',110,y+49,70,23.3)}catch(e){}
}
async function pdf(id){
  const m=$('msg2');m.textContent='';
  const list=id?visits.filter(v=>v.id===id):(sel.size?sorted().filter(v=>sel.has(v.id)):filtered());
  if(!list.length){m.textContent='No hay visitas que descargar.';return}
  if(!window.jspdf){m.textContent='No se pudo cargar el generador de PDF.';return}
  try{
    const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
    try{const i=$('logo');if(!i.naturalWidth)throw 0;const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);d.addImage(c.toDataURL('image/jpeg',0.9),'JPEG',80,10,50,50*i.naturalHeight/i.naturalWidth)}catch(e){d.setFontSize(18);d.text('PRESTIGE PROPERTIES',105,30,{align:'center'});d.setFontSize(9);d.text('SALES, RENTALS & CONCIERGE',105,37,{align:'center'})}
    d.setFontSize(15);d.text(list.length===1?'Ficha de visita':'Registro de visitas',105,58,{align:'center'});
    d.setFontSize(9);d.text('Generado el '+fmt(new Date().toISOString().slice(0,10)),105,64,{align:'center'});
    let y=72;
    list.forEach(v=>{if(y+76>287){d.addPage();y=20}block(d,v,y);y+=82});
    const data=d.output('arraybuffer');
    const name=list.length===1?'visita-'+String(list[0].ref).replace(/[^\w-]+/g,'_')+'.pdf':'visitas.pdf';
    if(dl){try{await dl.save({filename:name,data});m.textContent='PDF listo.';return}catch(e){if(e&&e.code==='declined')return;m.textContent='No se pudo descargar el PDF ('+(e&&e.code||'error')+').';return}}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));a.download=name;a.click();
  }catch(e){m.textContent='Error al generar el PDF.'}
}
function render(){buildPer();draw()}
function draw(){
  const f=filtered(),ids=new Set(f.map(v=>v.id));[...sel].forEach(i=>{if(!ids.has(i))sel.delete(i)});
  if(!f.length){$('list').innerHTML='<span class="mu">'+(visits.length?'No hay visitas que coincidan con la búsqueda.':'Aún no hay visitas.')+'</span>';upd();return}
  $('list').innerHTML=f.map(v=>`<div class="v"><div class="row"><label class="chk"><input type="checkbox" ${sel.has(v.id)?'checked':''} onchange="toggle('${v.id}',this.checked)"><b>Ref. ${esc(v.ref)}</b></label><span class="mu">${fmt(v.date)}</span></div>
  <div style="margin-top:6px"><span class="mu">Propiedad:</span> <b>${esc(v.property)}</b></div>
  <div><span class="mu">Cliente:</span> <b>${esc(v.client)}</b></div>
  ${v.rating||v.feedback?`<div style="margin-top:6px"><span style="color:#e8a317">${stars(v.rating)}</span> ${esc(v.feedback||'')}</div>`:''}
  <div class="sigs"><figure><img src="${v.clientSig}" alt="Firma cliente"><figcaption>Firma cliente</figcaption></figure><figure><img src="${v.agentSig}" alt="Firma agente"><figcaption>Firma agente</figcaption></figure></div>
  <div class="acts"><button onclick="pdf('${v.id}')">Descargar PDF</button><button onclick="del('${v.id}')">Eliminar</button></div></div>`).join('');
  upd();
}
async function del(id){
  if(!confirm('¿Eliminar esta visita?'))return;
  visits=visits.filter(x=>x.id!==id);sel.delete(id);render();
  try{if(db)await db.collection('visits').doc(id).delete()}catch(e){}
}
$('save').onclick=async()=>{
  const v={date:$('f').value,ref:$('r').value.trim(),property:$('p').value.trim(),client:$('c').value.trim(),rating,feedback:$('fb').value.trim()};
  if(!v.date||!v.ref||!v.property||!v.client)return msg('Completa todos los campos.');
  if(pads.sc.empty()||pads.sa.empty())return msg('Faltan las firmas del cliente y del agente.');
  v.clientSig=pads.sc.data();v.agentSig=pads.sa.data();v.id='v'+Date.now();v.created=Date.now();
  visits.unshift(v);render();
  try{if(db){await db.collection('visits').doc(v.id).set(v);msg('Visita guardada.')}else msg('Visita guardada.')}catch(e){msg('No se pudo guardar en la base de datos.')}
  ['r','p','c','fb'].forEach(i=>$(i).value='');rating=0;drawStars();clr('sc');clr('sa');
};
(async()=>{
  try{
    if(window.claude){
      dl=await claude.use('downloads');
      db=await claude.use('db');
      if(db)db.collection('visits').onSnapshot(s=>{visits=s.docs.map(d=>d.data()).sort((a,b)=>b.created-a.created);render()});
    }
  }catch(e){}
})();
</script>
<script>
(function(){
  var orig = render;
  render = function(){
    try { localStorage.setItem('visits', JSON.stringify(visits)); } catch(e) {}
    return orig.apply(this, arguments);
  };
  try {
    var s = JSON.parse(localStorage.getItem('visits') || 'null');
    if (Array.isArray(s)) visits = s;
  } catch(e) {}
  render();
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
