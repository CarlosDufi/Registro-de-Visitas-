<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de visitas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1b8f97">
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--ac:#1b8f97;--bd:#d9d7d0;--onac:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--tx:#eee;--mu:#9a9a94;--ac:#6fb3c8;--bd:#3a3a38;--onac:#0b2a33}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--tx:#eee;--mu:#9a9a94;--ac:#6fb3c8;--bd:#3a3a38;--onac:#0b2a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.logo{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;text-align:center;margin-bottom:8px}.logo img,.logo svg{max-width:260px;width:70%;height:auto}
h1{font-size:22px;margin:16px 0 16px;text-align:center}h2{font-size:17px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;min-height:46px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em;margin:0}
input[type=date]::-webkit-datetime-edit{padding:0}
textarea{width:100%;min-height:80px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;resize:vertical}
.stars{display:flex;gap:4px}.stars button{border:0;background:none;font-size:30px;line-height:1;padding:2px;color:var(--bd)}.stars button.on{color:#e8a317}
.tabs{display:flex;gap:6px;margin:0 0 12px}.tabs button{flex:1;padding:12px;border-radius:10px;font-size:15px}.tabs button.on{background:var(--ac);color:var(--onac)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px;border-bottom:1px solid var(--bd);padding:6px 4px}td{padding:9px 4px;border-bottom:1px solid var(--bd)}tr:last-child td{border-bottom:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.chk{display:flex;align-items:center;gap:10px;margin:0;font-size:16px;color:var(--tx);cursor:pointer}.chk input{width:22px;height:22px;padding:0;flex:none}
.sigs{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}.sigs figure{margin:0}.sigs img{height:64px;margin:0}.sigs figcaption{font-size:12px;color:var(--mu)}
[hidden]{display:none!important}
canvas{width:100%;height:130px;border:1px dashed var(--bd);border-radius:8px;background:#fff;touch-action:none;display:block}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:14px;cursor:pointer}
button.p{background:var(--ac);color:var(--onac);width:100%;font-size:16px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center}
.v{border-top:1px solid var(--bd);padding:12px 0}.v:first-child{border-top:0}
.v img{height:36px;background:#fff;border-radius:4px;border:1px solid var(--bd);margin-right:6px}
.mu{color:var(--mu);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.legal{font-size:12px;color:var(--mu);line-height:1.45;margin:14px 0 4px}.legal a{color:var(--ac)}.legal b{color:var(--tx)}
.userbar{margin:0 0 10px}.userbar .mu{margin-right:8px;overflow-wrap:anywhere}
.prop{border:1px solid var(--bd);border-radius:10px;padding:4px 12px 12px;margin:10px 0}.prop .row{margin-top:10px}.prop .rm{padding:4px 10px;font-size:12px}
#msg{color:var(--ac);font-size:14px;min-height:18px;margin-top:8px}
.langbar{display:flex;justify-content:flex-end;gap:6px;margin:0 0 4px}.lg{padding:4px 12px;font-size:12px;border-radius:6px}.lg.on{background:var(--ac);color:var(--onac)}
.hint{margin:0 0 6px}
.cb{position:relative}.cb .st{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu);margin-top:4px;min-height:16px}
.cb .sp{width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cb .sug{border:1px solid var(--bd);border-radius:8px;background:var(--card);margin-top:4px;max-height:220px;overflow-y:auto}
.cb .sug button{display:block;width:100%;text-align:left;border:0;border-radius:0;border-bottom:1px solid var(--bd);padding:10px 12px;font-size:15px;color:var(--tx);background:transparent}
.cb .sug button:last-child{border-bottom:0}.cb .sug small{display:block;color:var(--mu);font-size:12px}
.cb .lk{color:var(--ac)}
.crm{margin-top:8px;font-size:12px;color:var(--mu);display:flex;gap:8px;align-items:center;flex-wrap:wrap}.crm button{padding:3px 10px;font-size:12px}.crm .okc{color:#2e8b57}.crm .erc{color:#b3261e}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns button{flex:1 1 130px}
.fbk{margin-top:10px;padding:10px;border:1px dashed var(--bd);border-radius:10px}
.fbk textarea{margin-top:6px}.fbk .stars{margin-top:4px}
.stars.ro span{font-size:22px;line-height:1;color:var(--bd)}.stars.ro span.on{color:#e8a317}
</style>
</head>

  const inp=$(o.input),st=$(o.status),sg=$(o.list);let seq=0,timer=null,ctl=null,items=[];
  const close=()=>{sg.hidden=true;sg.innerHTML=''};
  const say=(txt,spin)=>{st.innerHTML=spin?'<span class="sp"></span>':'';if(txt){const s=document.createElement('span');s.textContent=txt;st.appendChild(s)}};
  async function run(q){
    const my=++seq;if(ctl)ctl.abort();ctl=new AbortController();
    if(!navigator.onLine){say(t('cbOffline'),false);close();return}
    say(t('searching'),true);
    try{
      const r=await fnCall(o.fn,{q},ctl.signal);
      if(my!==seq)return;
      items=(r&&r.items)||[];
      if(!items.length){say(t('noResults'),false);close();return}
      say('',false);
      sg.innerHTML='';
      items.forEach((it,i)=>{const b=document.createElement('button'),r=o.render(it);b.type='button';b.innerHTML=esc(r.title)+(r.sub?'<small>'+esc(r.sub)+'</small>':'');
        b.addEventListener('pointerdown',e=>e.preventDefault());
        b.addEventListener('click',()=>{close();say('',false);o.onPick(it)});sg.appendChild(b)});
      sg.hidden=false;
    }catch(e){if(my!==seq||(e&&e.name==='AbortError'))return;say(t('cbError')+' ('+String((e&&(e.message||e.name))||e).slice(0,60)+')',false);close()}
  }
  inp.addEventListener('input',()=>{
    o.onEdit();clearTimeout(timer);const q=inp.value.trim();
    if(q.length<(o.minChars||2)){seq++;if(ctl)ctl.abort();say('',false);close();return}
    timer=setTimeout(()=>run(q),350);
  });
  inp.addEventListener('blur',()=>setTimeout(close,200));
  return{reset(){seq++;clearTimeout(timer);if(ctl)ctl.abort();say('',false);close()},say};
}

/* Vincula con el CRM las propiedades escritas a mano (p. ej. sin conexión): solo si el CRM devuelve exactamente
   una propiedad con la misma referencia. Si el CRM no responde, se deja sin vincular y la visita se envía igual. */
async function linkProps(props){
  const key=s=>String(s||'').trim().toLowerCase();
  await Promise.all((props||[]).map(async p=>{
    const ref=String(p.ref||'').trim();
    if(p.crmPropertyId||ref.length<2||ref.length>40)return;
    try{
      const r=await wt(fnCall('searchProperties',{q:ref}),8000);
      const m=((r&&r.items)||[]).filter(it=>key(it.reference_no)===key(ref));
      const pid=m.length===1?Number(m[0].id):0;
      if(Number.isInteger(pid)&&pid>0)p.crmPropertyId=pid;
    }catch(e){}
  }));
}

/* Si la función del servidor se corta, la visita puede quedarse en "syncing". El servidor acepta un reintento
   pasados 90 s; la app lo ofrece (manual, para no duplicar eventos) pasados 2 min desde lockAt. */
const CRM_STUCK=120000;let stuckTimer=null;
const crmStuck=c=>Date.now()-(Number(c.lockAt)||0)>=CRM_STUCK;
function armStuck(list){
  clearTimeout(stuckTimer);stuckTimer=null;
  const next=Math.min(...list.map(v=>v.crm&&v.crm.status==='syncing'&&!crmStuck(v.crm)?(Number(v.crm.lockAt)||0)+CRM_STUCK:Infinity));
  if(next<Infinity)stuckTimer=setTimeout(draw,Math.max(0,next-Date.now())+500);
}
function crmLine(v,own){
  const linked=getProps(v).some(p=>p.crmPropertyId);
  if(!linked)return`<div class="crm">${esc(t('crmSkip'))}</div>`;
  const c=v.crm||{};
  if(pend.some(p=>p.id===v.id))return`<div class="crm">${esc(t('crmWait'))}</div>`;
  const retry=own?`<button type="button" data-act="crm" data-id="${esc(v.id)}">${esc(t('crmRetry'))}</button>`:'';
  if(crmBusy[v.id]||(c.status==='syncing'&&!crmStuck(c)))return`<div class="crm">${esc(t('crmSyncing'))}</div>`;
  if(c.status==='syncing')return`<div class="crm"><span class="erc">${esc(t('crmStuck'))}</span>${retry}</div>`;
  if(c.status==='ok')return`<div class="crm"><span class="okc">✓ ${esc(t('crmOk',c.eventId))}</span>${c.message?` <span>${esc(c.message)}</span>`:''}</div>`;
  if(c.status==='error')return`<div class="crm"><span class="erc">${esc(t('crmErr',c.message||''))}</span>${retry}</div>`;
  return`<div class="crm">${esc(t('crmWait'))}${retry}</div>`;
}

const PAGE=30;let shown=PAGE,qT=null;
function refilter(){shown=PAGE;draw()}
function qInput(){clearTimeout(qT);qT=setTimeout(refilter,250)}
function draw(){
  const ae=document.activeElement;
  if(ae&&ae.classList&&ae.classList.contains('fbt')&&$('list').contains(ae)){deferred=true;upd();return}
  deferred=false;
  const f=filtered(),ids=new Set(f.map(v=>v.id));[...sel].forEach(i=>{if(!ids.has(i))sel.delete(i)});
  if(!f.length){$('list').innerHTML='<span class="mu">'+esc(t(visits.length?'noMatch':'empty'))+'</span>';armStuck([]);upd(f);return}
  const page=f.slice(0,shown);
  $('list').innerHTML=page.map(v=>{
    const ps=getProps(v),multi=ps.length>1,own=!!(me&&v.agentUid===me.uid),c=cur(v);
    const sg=(nm,sig,lab,cap)=>sig?`<div class="mu">${esc(t(lab))}: <b>${esc(nm||'')}</b></div><div class="sigs">${sigFig(sig,t(cap))}</div>`:'';
    const plist=ps.map((p,k)=>`<div style="margin-top:6px"><span class="mu">${esc(t('propL'))}${multi?' '+(k+1):''}:</span> <b>${esc(p.property||p.ref||'—')}</b>${multi&&p.property&&p.ref?` <span class="mu">(Ref. ${esc(p.ref)})</span>`:''}${sg(p.ownerName,p.ownerSig,'ownerL','ownerSig')}${sg(p.collabName,p.collabSig,'collabL','collabSig')}</div>`).join('');
    const refs=ps.map(p=>p.ref).filter(Boolean),head=refs.length?'Ref. '+refs.map(esc).join(' · '):ps.map(p=>esc(p.property||'—')).join(' · ');
    let fb='';
    if(own){
      fb=`<div class="fbk"><div class="mu">${esc(t('fbTitle'))}</div><div class="stars" data-st="${esc(v.id)}">${[1,2,3,4,5].map(n=>`<button type="button" class="${n<=c.rating?'on':''}" data-act="star" data-id="${esc(v.id)}" data-n="${n}" aria-label="${esc(t('star',n))}">★</button>`).join('')}</div>
      <textarea class="fbt" rows="3" placeholder="${esc(t('fbPh'))}" data-id="${esc(v.id)}">${esc(c.feedback)}</textarea>
      <div class="row" style="margin-top:6px;gap:8px"><button type="button" data-act="fb" data-id="${esc(v.id)}">${esc(t('fbSave'))}</button><span class="mu" id="fbm-${esc(v.id)}">${esc(fbm[v.id]||(fbd[v.id]?t('unsaved'):''))}</span></div></div>`;
    }else if(v.rating||v.feedback){
      fb=`<div class="fbk"><div class="mu">${esc(t('fbTitle'))}</div><div class="stars ro">${[1,2,3,4,5].map(n=>`<span class="${n<=(v.rating||0)?'on':''}">★</span>`).join('')}</div>${v.feedback?`<div>${esc(v.feedback)}</div>`:''}</div>`;
    }
    return `<div class="v"><div class="row"><label class="chk"><input type="checkbox" class="selv" data-id="${esc(v.id)}" ${sel.has(v.id)?'checked':''}><b>${head}</b>${pend.some(p=>p.id===v.id)?(v.sendErr?` <span style="color:#b3261e;font-size:12px">· ${esc(t('errTag',v.sendErr))}</span>`:` <span style="color:#b26a00;font-size:12px">· ${esc(t('pendTag'))}</span>`):''}</label><span class="mu">${esc(fmt(v.date))}</span></div>
  ${plist}
  <div style="margin-top:6px"><span class="mu">${esc(t('clientL'))}:</span> <b>${v.client?esc(v.client):'—'}</b></div>
  <div><span class="mu">${esc(t('agentL'))}:</span> <b>${esc(nombre(v.agentEmail))}</b></div>
  <div class="sigs">${v.clientSig?sigFig(v.clientSig,t('clientSig')):`<div class="mu" style="align-self:center">${esc(t('clientUnsigned'))}</div>`}${sigFig(v.agentSig,t('agentSig'))}${v.collabSig?sigFig(v.collabSig,t('collabSig'),v.collabName?' · '+esc(v.collabName):''):''}</div>
  ${fb}
  ${crmLine(v,own)}
  <div class="acts"><button data-act="pdf" data-id="${esc(v.id)}">${esc(t('dlPdf'))}</button><button data-act="share" data-id="${esc(v.id)}">${esc(t('shPdf'))}</button>${own?`<button data-act="del" data-id="${esc(v.id)}">${esc(t('del'))}</button>`:''}</div></div>`}).join('');
  if(f.length>page.length)$('list').insertAdjacentHTML('beforeend',`<div style="text-align:center;padding:12px 0 4px"><button type="button" data-act="more">${esc(t('more',f.length-page.length))}</button></div>`);
  armStuck(page);upd(f);
}
/* Acciones de la lista por delegación: el id viaja en data-id (texto), nunca dentro de un onclick */
$('list').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||!$('list').contains(b))return;const id=b.dataset.id;
  switch(b.dataset.act){
    case 'pdf':pdf(id);break;case 'share':pdf(id,true);break;case 'del':del(id);break;
    case 'fb':saveFb(id);break;case 'crm':crmSync(id);break;case 'star':setStar(id,+b.dataset.n);break;case 'more':shown+=PAGE;draw();break;
  }
});
$('list').addEventListener('change',e=>{if(e.target.classList.contains('selv'))toggle(e.target.dataset.id,e.target.checked)});
$('list').addEventListener('input',e=>{if(e.target.classList.contains('fbt'))fbInput(e.target.dataset.id,e.target.value)});
$('list').addEventListener('focusout',e=>{
  if(e.target.classList&&e.target.classList.contains('fbt'))setTimeout(()=>{if(deferred&&!$('list').contains(document.activeElement)){deferred=false;draw()}},600);
});
async function del(id){
  if(!confirm(t('delConfirm'))||!me)return;
  pend=pend.filter(p=>p.id!==id);savePend();
  if(!isBorr(id)){borr.push({id,uid:me.uid});saveBorr()}
  merge();render();runDeletes();
}
/* Borra en el servidor las visitas apuntadas. Error de conexión: se reintenta más tarde. permission-denied/not-found:
   la visita no existe en el servidor (nunca llegó), no hay nada que borrar. Otro error: se avisa y la visita vuelve a verse. */
let deleting=false;
async function runDeletes(){
  if(deleting||!me||!navigator.onLine)return;
  deleting=true;
  try{
    for(const b of borr.filter(b=>b.uid===me.uid)){
      try{await wt(db.collection('visits').doc(b.id).delete(),15000)}
      catch(e){
        const c=(e&&e.code)||'error';
        if(NET_ERR.includes(c))break;
        if(c!=='permission-denied'&&c!=='not-found'){$('msg2').textContent=t('delFail',c)}
      }
      borr=borr.filter(x=>x.id!==b.id);saveBorr();merge();render();
    }
  }finally{deleting=false}
}
/* ===== Guardar visita ===== */
$('save').onclick=async()=>{
  if(!me)return;
  const props=[];
  for(const n of rows){
    const ref=$('r'+n).value.trim(),property=$('p'+n).value.trim(),idx=rows.indexOf(n)+1;
    if(!ref&&!property)return msg(t('needProp',idx,rows.length>1));
    const p={ref,property};
    const pid=Number($('r'+n).dataset.pid);if(Number.isInteger(pid)&&pid>0)p.crmPropertyId=pid;
    for(const k of ['o','c']){
      const sg=SG[k];if($(sg.w+n).hidden)continue;
      const nm=$(sg.n+n).value.trim(),has=!pads[sg.p+n].empty();
      if(!nm&&!has)continue;
      if(!nm||!has)return msg(t(k==='o'?'ownerInc':'collabIncP',idx));
      if(k==='o'){p.ownerName=nm;p.ownerSig=pads['os'+n].data()}else{p.collabName=nm;p.collabSig=pads['cs'+n].data()}
    }
    props.push(p);
  }
  const v={date:$('f').value,client:$('c').value.trim(),props,ref:props[0].ref,property:props[0].property,rating:0,feedback:'',lang:LANG};
  const cid=Number($('c').dataset.cid);if(v.client&&Number.isInteger(cid)&&cid>0)v.clientId=cid;
  if(!v.date)return msg(t('needDate'));
  if(v.date>hoy())return msg(t('noFuture'));
  if(pads.sa.empty())return msg(t('needAgentSig'));
  if(!$('cvw').hidden){
    const cn=$('cvn').value.trim(),ch=!pads.cvs.empty();
    if(cn||ch){if(!cn||!ch)return msg(t('collabInc'));v.collabName=cn;v.collabSig=pads.cvs.data()}
  }
  v.clientSig=pads.sc.empty()?'':pads.sc.data();v.agentSig=pads.sa.data();v.id='v'+Date.now();v.created=Date.now();
  v.agentUid=me.uid;v.agentEmail=(me.email||'').toLowerCase();
  $('save').disabled=true;msg(t('saving'));
  let queued=false;
  if(!navigator.onLine)queued=true;
  else{
    await linkProps(v.props);
    try{await wt(db.collection('visits').doc(v.id).set(v),8000)}
    catch(e){
      if(e&&(e.code==='timeout'||e.code==='unavailable'))queued=true;
      else{msg(t('saveFail',(e&&e.code)||'error'));$('save').disabled=false;return}
    }
  }
  if(queued){pend.push(v);const ok=savePend();merge();render();msg(t(ok?'queued':'queuedMem'))}
  else{msg(t('saved'));crmSync(v.id,v)}
  refreshDate();resetRows();$('c').value='';delete $('c').dataset.cid;$('stc').innerHTML='';clr('sc');clr('sa');if(!$('cvw').hidden)togCollab();
  $('save').disabled=false;
};
/* Errores de conexión: se para y se reintenta más tarde. Cualquier otro error marca la visita (sendErr) y se sigue con las demás.
   Las visitas con error solo se reintentan con «Enviar ahora» (all=true) y una vez al abrir la app o iniciar sesión. */
const NET_ERR=['timeout','unavailable','deadline-exceeded','unauthenticated'];let errRetried=false;
async function flush(all){
  if(flushing||!me||!navigator.onLine)return;
  runDeletes();
  if(!errRetried){all=true;errRetried=true}
  flushing=true;
  try{
    for(const v of [...pend]){
      if(v.agentUid!==me.uid||(v.sendErr&&all!==true))continue;
      await linkProps(v.props);if(!pend.includes(v))continue;savePend();
      const {sendErr,...data}=v;
      try{await wt(db.collection('visits').doc(v.id).set(data),15000)}
      catch(e){
        const c=(e&&e.code)||'error';
        if(NET_ERR.includes(c))break;
        v.sendErr=c;savePend();merge();render();continue;
      }
      pend=pend.filter(x=>x.id!==v.id);savePend();merge();render();if(!isBorr(v.id))crmSync(v.id,data);
    }
  }finally{flushing=false}
}
function show(w){$('boot').hidden=true;$('auth').hidden=w!=='auth';$('app').hidden=w!=='app'}
function authErr(e){
  const c=(e&&e.code)||'';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(c))return t('aBad');
  if(c==='auth/too-many-requests')return t('aMany');
  if(c==='auth/network-request-failed')return t('aNet');
  return t('aFail');
}
$('login').onclick=async()=>{
  const em=$('em').value.trim(),pw=$('pw').value;
  if(!em||!pw){$('amsg').textContent=t('aEmpty');return}
  $('login').disabled=true;$('amsg').textContent='';
  try{await auth.signInWithEmailAndPassword(em,pw);$('pw').value=''}catch(e){$('amsg').textContent=authErr(e)}
  $('login').disabled=false;
};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click()});
$('forgot').onclick=async()=>{
  const em=$('em').value.trim();
  if(!em){$('amsg').textContent=t('aMail');return}
  try{await auth.sendPasswordResetEmail(em)}catch(e){}
  $('amsg').textContent=t('aReset');
};
function logout(){
  const n=me?pend.filter(p=>p.agentUid===me.uid).length:0;
  if(n&&!confirm(t('logoutConfirm',n)))return;
  auth.signOut();
}
function legacy(){try{const a=JSON.parse(localStorage.getItem('visits')||'null');return Array.isArray(a)?a:[]}catch(e){return[]}}
function checkLegacy(){const n=legacy().length;$('legacy').hidden=!n;if(n)$('legacyTxt').textContent=t('legacyN',n)}
async function uploadLegacy(){
  const a=legacy();if(!a.length||!me)return;
  try{
    for(let i=0;i<a.length;i+=400){
      const b=db.batch();
      a.slice(i,i+400).forEach((v,k)=>{v.id=v.id||('v'+Date.now()+'_'+i+'_'+k);v.created=v.created||Date.now();v.agentUid=me.uid;v.agentEmail=(me.email||'').toLowerCase();b.set(db.collection('visits').doc(v.id),v)});
      await b.commit();
    }
    localStorage.removeItem('visits');$('legacy').hidden=true;$('msg2').textContent=t('uploaded');
  }catch(e){$('msg2').textContent=t('uploadFail',e.code||'error')}
}
function dropLegacy(){if(confirm(t('dropConfirm'))){localStorage.removeItem('visits');$('legacy').hidden=true}}
async function start(){
  if(!me)return;const u=me;
  if(unsub){unsub();unsub=null}
  let sup=isSup;
  try{sup=(await wt(db.collection('supervisores').doc((u.email||'').toLowerCase()).get(),8000)).exists}catch(e){}
  if(me!==u)return;
  isSup=sup;$('who').textContent=u.email+(isSup?t('sup'):'');
  const col=db.collection('visits'),qy=isSup?col:col.where('agentUid','==',u.uid);
  unsub=qy.onSnapshot(s=>{srv=s.docs.map(d=>({...d.data(),id:d.id}));merge();render()},e=>{$('msg2').textContent=t('loadFail',e.code||'error')});
  render();flush();
}
auth.onAuthStateChanged(u=>{
  if(unsub){unsub();unsub=null}
  srv=[];visits=[];sel.clear();me=u;isSup=false;errRetried=false;shown=PAGE;
  if(!u){$('q').value='';$('per').value='all';$('ag').value='all';show('auth');return}
  $('who').textContent=u.email;
  show('app');tab(1);checkLegacy();net();merge();render();start();
});
window.addEventListener('online',()=>{net();start()});
window.addEventListener('offline',net);
setInterval(flush,30000);
/* ===== Aplicar idioma ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.title=t('title');
  tr(document);
  $('legal').innerHTML=esc(t('legal')).replace('www.aepd.es','<a href="https://www.aepd.es" target="_blank" rel="noopener">www.aepd.es</a>')+'<br><b>'+esc(t('legalSign'))+'</b>';
  ['es','en'].forEach(l=>$('lg-'+l).classList.toggle('on',l===LANG));
  rows.forEach(n=>{sigBtn(n,'o');sigBtn(n,'c');linkNote(n)});if($('c').dataset.cid)$('stc').innerHTML='<span class="lk">✓ '+esc(t('linkedC'))+'</span>';collabBtn();renumber();
  if(me){$('who').textContent=me.email+(isSup?t('sup'):'');checkLegacy()}
  render();
}
function setLang(l){if(l!=='es'&&l!=='en')return;LANG=l;try{localStorage.setItem('lang',l)}catch(e){}msg('');$('amsg').textContent='';$('msg2').textContent='';applyLang()}
applyLang();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
